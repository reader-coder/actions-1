name: Check OS and Node versions

on:
    push:
        branches: 
            - main
    pull_request: 
        branches: 
            - main
concurrency: 
    group: test
    cancel-in-progress: true
jobs:
    test:
        timeout-minutes: 5
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node-version: [18, 20, 22]
        runs-on: ${{matrix.os}}
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: ${{matrix.node-version}}
            - name: Print OS and Node version
              run: |
                echo ${{runner.os}}
                node --version
                npm --version
    summary:
        needs: test
        runs-on: ubuntu-slim
        steps:
            - name: Print summary
              run: echo "All platform and Node.js tests completed successfully."
